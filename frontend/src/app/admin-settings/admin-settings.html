<div class="settings-page">

  <div class="settings-container">

    <div class="settings-header">

      <div>

        <h1>
          Admin Settings
        </h1>

        <p>
          Manage your administrator account
        </p>

      </div>

      <button
        type="button"
        class="logout-button"
        (click)="adminLogout()">

        Admin Logout

      </button>

    </div>


    @if (loading) {

      <div class="loading-box">

        <h2>
          Loading Admin Settings...
        </h2>

        <p>
          Please wait
        </p>

      </div>

    }


    @if (!loading) {

      <div class="settings-card">

        <h2>
          Account Information
        </h2>

        <p class="description">
          Update your administrator username,
          email and password.
        </p>


        <!-- Username -->

        <div class="input-group">

          <label>
            Admin Username
          </label>

          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter admin username"
          >

        </div>


        <!-- Email -->

        <div class="input-group">

          <label>
            Admin Email
          </label>

          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Enter admin email"
          >

        </div>


        <!-- Password -->

        <div class="input-group">

          <label>
            New Password
          </label>

          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter new password"
          >

        </div>


        <!-- Confirm Password -->

        <div class="input-group">

          <label>
            Confirm Password
          </label>

          <input
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
          >

        </div>


        <!-- Error Message -->

        @if (message) {

          <div class="error-message">

            {{ message }}

          </div>

        }


        <!-- Success Message -->

        @if (successMessage) {

          <div class="success-message">

            {{ successMessage }}

          </div>

        }


        <!-- Update Button -->

        <button
          type="button"
          class="update-button"
          (click)="updateSettings()"
          [disabled]="saving">

          @if (saving) {

            Updating...

          } @else {

            Update Admin Settings

          }

        </button>


        <!-- Dashboard Button -->

        <button
          type="button"
          class="dashboard-button"
          (click)="goToDashboard()">

          ← Back to Admin Dashboard

        </button>

      </div>

    }

  </div>

</div>
