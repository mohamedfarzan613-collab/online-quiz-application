<div class="settings-page">

  <div class="settings-container">

    <!-- HEADER -->
    <div class="settings-header">

      <div>
        <h1>Admin Settings</h1>

        <p>
          Manage your administrator account
        </p>
      </div>

      <button
        type="button"
        class="logout-button"
        (click)="adminLogout()">

        Admin Logout

      </button>

    </div>


    <!-- SETTINGS CARD -->
    <div class="settings-card">

      <h2>
        Account Information
      </h2>

      <p class="description">
        Update your administrator username,
        email and password.
      </p>


      <!-- USERNAME -->
      <div class="input-group">

        <label>
          Admin Username
        </label>

        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter admin username">

      </div>


      <!-- EMAIL -->
      <div class="input-group">

        <label>
          Admin Email
        </label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter admin email">

      </div>


      <!-- PASSWORD -->
      <div class="input-group">

        <label>
          New Password
        </label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter new password">

      </div>


      <!-- CONFIRM PASSWORD -->
      <div class="input-group">

        <label>
          Confirm Password
        </label>

        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm new password">

      </div>


      <!-- ERROR MESSAGE -->
      @if (message) {

        <div class="error-message">
          {{ message }}
        </div>

      }


      <!-- SUCCESS MESSAGE -->
      @if (successMessage) {

        <div class="success-message">
          {{ successMessage }}
        </div>

      }


      <!-- UPDATE BUTTON -->
      <button
        type="button"
        class="update-button"
        (click)="updateSettings()"
        [disabled]="saving">

        @if (saving) {
          Updating...
        } @else {
          Update Admin Settings
        }

      </button>


      <!-- BACK BUTTON -->
      <button
        type="button"
        class="dashboard-button"
        (click)="goToDashboard()">

        ← Back to Admin Dashboard

      </button>

    </div>

  </div>

</div>
